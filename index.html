<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>@esc4k</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    font-family:Arial,sans-serif;
    color:white;
    overflow:hidden;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.65)),
    url("background.jpg") center/cover no-repeat;
}

.container{
    width:100%;
    max-width:430px;
    height:100vh;
    padding:25px 20px;

    display:flex;
    flex-direction:column;
    justify-content:center;

    backdrop-filter:blur(2px);
}

.logo{
    text-align:center;
    font-size:19px;
    font-weight:bold;
    letter-spacing:1px;
    margin-bottom:25px;
    text-shadow:0 2px 10px #000;
}

/* Progress */

.progress-info{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    opacity:.8;
    margin-bottom:8px;
}

.progress{
    width:100%;
    height:5px;
    background:rgba(255,255,255,.18);
    border-radius:20px;
    overflow:hidden;
    margin-bottom:35px;
}

.progress-bar{
    height:100%;
    width:20%;
    background:white;
    border-radius:20px;
    transition:width .5s ease;
}

/* Question */

.question-box{
    text-align:center;
    animation:fadeIn .5s ease;
}

.question{
    font-size:27px;
    font-weight:bold;
    line-height:1.3;
    margin-bottom:28px;
    text-shadow:0 3px 15px #000;
}

/* Answers */

.answers{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.answer{
    width:100%;
    padding:16px 18px;

    border:1px solid rgba(255,255,255,.25);
    border-radius:16px;

    background:rgba(255,255,255,.10);
    color:white;

    font-size:16px;
    text-align:center;

    cursor:pointer;

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);

    transition:.25s;
}

.answer:hover{
    background:rgba(255,255,255,.22);
    transform:translateY(-2px);
}

.answer.selected{
    background:white;
    color:#111;
    border-color:white;
    transform:scale(1.02);
}

/* Next */

.next-btn{
    width:100%;
    padding:17px;

    margin-top:22px;

    border:0;
    border-radius:16px;

    background:white;
    color:#111;

    font-size:17px;
    font-weight:bold;

    cursor:pointer;

    transition:.25s;
}

.next-btn:hover{
    transform:scale(1.02);
}

.next-btn:active{
    transform:scale(.98);
}

/* Footer */

.footer{
    text-align:center;
    margin-top:28px;
    font-size:13px;
    opacity:.6;
}

/* Thank you */

.thanks{
    text-align:center;
    animation:fadeIn .8s ease;
}

.thanks-icon{
    font-size:50px;
    margin-bottom:15px;
}

.thanks h1{
    font-size:30px;
    margin:0 0 15px;
}

.thanks p{
    font-size:17px;
    line-height:1.8;
    opacity:.85;
}

.thanks .footer{
    margin-top:35px;
}

/* Animation */

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(15px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

.hidden{
    display:none;
}

</style>
</head>

<body>

<div class="container">

    <div class="logo">@esc4k</div>

    <div id="quiz">

        <div class="progress-info">
            <span id="questionNumber">Question 1</span>
            <span>5</span>
        </div>

        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="question-box" id="questionBox">

            <div class="question" id="question"></div>

            <div class="answers" id="answers"></div>

            <button class="next-btn" onclick="nextQuestion()">
                Continue
            </button>

        </div>

    </div>


    <div id="thanks" class="thanks hidden">

        <div class="thanks-icon">?</div>

        <h1>Thank You!</h1>

        <p>
            Thank you for taking the time to complete this survey.
            We hope you enjoy your time with us.
        </p>

        <div class="footer">
            @esc4k
        </div>

    </div>

</div>


<script>

let currentQuestion = 0;
let selectedAnswer = "";

const questions = [

{
    text:"How old are you?",
    options:[
        "Under 13",
        "13 - 17",
        "18 - 24",
        "25 - 34",
        "35 - 44",
        "45 - 54",
        "55+"
    ]
},

{
    text:"Which country are you from?",
    options:[
        "Algeria",
        "Morocco",
        "Tunisia",
        "Libya",
        "Egypt",
        "Saudi Arabia",
        "United Arab Emirates",
        "Qatar",
        "Kuwait",
        "Bahrain",
        "Oman",
        "Iraq",
        "Jordan",
        "Palestine",
        "Lebanon",
        "Syria",
        "Yemen",
        "Sudan",
        "Mauritania",
        "Somalia",
        "Turkey",
        "France",
        "Germany",
        "Spain",
        "Italy",
        "United Kingdom",
        "Canada",
        "United States",
        "Brazil",
        "Argentina",
        "India",
        "Pakistan",
        "China",
        "Japan",
        "South Korea",
        "Australia",
        "Other"
    ]
},

{
    text:"What is your favorite device?",
    options:[
        "Android",
        "iPhone",
        "Computer",
        "Tablet"
    ]
},

{
    text:"What type of content do you enjoy?",
    options:[
        "Nature & Relaxation",
        "Travel",
        "Gaming",
        "Technology",
        "Sports",
        "Music",
        "Other"
    ]
},

{
    text:"How much time do you spend online each day?",
    options:[
        "Less than 1 hour",
        "1 - 3 hours",
        "3 - 5 hours",
        "5 - 8 hours",
        "More than 8 hours"
    ]
}

];


function loadQuestion(){

    selectedAnswer = "";

    const q = questions[currentQuestion];

    document.getElementById("question").textContent = q.text;

    document.getElementById("questionNumber").textContent =
        "Question " + (currentQuestion + 1);

    document.getElementById("progressBar").style.width =
        ((currentQuestion + 1) / questions.length * 100) + "%";

    const answers = document.getElementById("answers");

    answers.innerHTML = "";

    q.options.forEach(option => {

        const button = document.createElement("button");

        button.className = "answer";

        button.textContent = option;

        button.onclick = function(){

            document
            .querySelectorAll(".answer")
            .forEach(btn => btn.classList.remove("selected"));

            button.classList.add("selected");

            selectedAnswer = option;
        };

        answers.appendChild(button);

    });

}


function nextQuestion(){

    if(!selectedAnswer){

        alert("Please select an answer.");

        return;
    }

    currentQuestion++;

    if(currentQuestion >= questions.length){

        document.getElementById("quiz")
        .classList.add("hidden");

        document.getElementById("thanks")
        .classList.remove("hidden");

    }else{

        loadQuestion();

    }

}


loadQuestion();

</script>

</body>
</html>
