<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>@esc4k</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:100%;
    max-width:430px;
    min-height:100vh;
    padding:25px 20px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    background:linear-gradient(160deg,#172b38,#0b141a);
}

.logo{
    text-align:center;
    font-size:18px;
    font-weight:bold;
    margin-bottom:25px;
    opacity:.85;
}

.progress{
    width:100%;
    height:5px;
    background:#ffffff20;
    border-radius:10px;
    margin-bottom:30px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:20%;
    background:white;
    border-radius:10px;
    transition:.3s;
}

.question{
    font-size:25px;
    font-weight:bold;
    text-align:center;
    margin-bottom:25px;
}

select{
    width:100%;
    padding:16px;
    border:none;
    border-radius:14px;
    background:#ffffff12;
    color:white;
    font-size:17px;
    outline:none;
    border:1px solid #ffffff20;
}

select option{
    color:black;
}

button{
    width:100%;
    padding:16px;
    margin-top:20px;
    border:0;
    border-radius:14px;
    background:white;
    color:#111;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:active{
    transform:scale(.98);
}

.footer{
    text-align:center;
    margin-top:30px;
    font-size:14px;
    opacity:.55;
}

.hidden{
    display:none;
}

.thanks{
    text-align:center;
}

.thanks h1{
    font-size:29px;
    margin-bottom:18px;
}

.thanks p{
    font-size:17px;
    line-height:1.8;
    opacity:.85;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">@esc4k</div>

    <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <div id="quiz">

        <div class="question" id="question">
            How old are you?
        </div>

        <div id="answerArea"></div>

        <button onclick="nextQuestion()">Next</button>

    </div>

    <div id="thanks" class="thanks hidden">

        <h1>Thank You! ??</h1>

        <p>
            Thank you for taking the time to complete this survey.
            We hope you enjoy your time with us.
        </p>

        <div class="footer">@esc4k</div>

    </div>

</div>

<script>

let currentQuestion = 0;

const questions = [

    {
        text:"How old are you?",
        options:[
            "Under 13",
            "13 - 17",
            "18 - 24",
            "25 - 34",
            "35 - 44",
            "45 - 54",
            "55+"
        ]
    },

    {
        text:"Which country are you from?",
        options:[
            "Algeria",
            "Morocco",
            "Tunisia",
            "Libya",
            "Egypt",
            "Saudi Arabia",
            "United Arab Emirates",
            "Qatar",
            "Kuwait",
            "Bahrain",
            "Oman",
            "Iraq",
            "Jordan",
            "Palestine",
            "Lebanon",
            "Syria",
            "Yemen",
            "Sudan",
            "Mauritania",
            "Somalia",
            "Turkey",
            "France",
            "Germany",
            "Spain",
            "Italy",
            "United Kingdom",
            "Canada",
            "United States",
            "Brazil",
            "Argentina",
            "India",
            "Pakistan",
            "China",
            "Japan",
            "South Korea",
            "Australia",
            "Other"
        ]
    },

    {
        text:"What is your favorite device?",
        options:[
            "Android",
            "iPhone",
            "Computer",
            "Tablet"
        ]
    },

    {
        text:"What type of content do you enjoy?",
        options:[
            "Nature & Relaxation",
            "Travel",
            "Gaming",
            "Technology",
            "Sports",
            "Music",
            "Other"
        ]
    },

    {
        text:"How much time do you spend online each day?",
        options:[
            "Less than 1 hour",
            "1 - 3 hours",
            "3 - 5 hours",
            "5 - 8 hours",
            "More than 8 hours"
        ]
    }

];

function loadQuestion(){

    const q = questions[currentQuestion];

    document.getElementById("question").textContent = q.text;

    let html = `
        <select id="answer">
            <option value="">Select your answer</option>
    `;

    q.options.forEach(option => {
        html += `<option value="${option}">${option}</option>`;
    });

    html += `</select>`;

    document.getElementById("answerArea").innerHTML = html;

    document.getElementById("progressBar").style.width =
        ((currentQuestion + 1) / questions.length * 100) + "%";
}

function nextQuestion(){

    const answer = document.getElementById("answer").value;

    if(!answer){
        alert("Please select an answer.");
        return;
    }

    currentQuestion++;

    if(currentQuestion >= questions.length){

        document.getElementById("quiz").classList.add("hidden");
        document.getElementById("thanks").classList.remove("hidden");

    }else{

        loadQuestion();

    }
}

loadQuestion();

</script>

</body>
</html>
